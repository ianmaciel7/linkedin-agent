[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-agent"
version = "0.1.0"
description = "An ADK-based assistant for LinkedIn workflow automation and growth support."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=0.1.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"




