[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-agent"
version = "0.1.0"
description = "An ADK-based assistant for LinkedIn workflow automation and growth support."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=0.1.0",
  "hypothesis>=6.156.6",
  "pytest>=8.0.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
]

[tool.setuptools]
packages = ["app", "app.linkedin", "app.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
project-excludes = [
    "**/pyrefly_virtual/**",
    "**/__pyrefly_virtual__/**",
]


